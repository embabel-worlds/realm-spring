        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/form-login.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/http-basic.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/index.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/logout.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/oauth2.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/request-builders.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/request-post-processors.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/result-handlers.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/result-matchers.html
        - https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/setup.html
        - https://docs.spring.io/spring-security/reference/spring-projects.html
        - https://docs.spring.io/spring-security/reference/whats-new.html
    document:
      url: "{{ url }}"
      sourceKind: spring-docs
      tags: [spring-docs, spring-reference]
    sync:
      trigger: on-install
      schedule: "0 30 4 * * MON"
      prune: true

  # A PROJECT'S OWN DOCUMENTS: the Markdown and AsciiDoc files of every project kept on the Spring
  # page (README, docs/, decision records), fetched from its repository host and tagged
  # `project-docs`. GitHub repositories the appliance can read without a login; a private
  # repository's files are not fetched. Read again when a project's commit changes.
  - name: project-docs
    lane: documents
    extractEntities: false
    from:
      cypher: |
        MATCH (sp:SpringProject)-[:HAS_DOC_FILE]->(f:SpringProjectFile)
        WHERE f.extension IN ['md', 'markdown', 'adoc'] AND f.link CONTAINS 'github.com/' AND f.link CONTAINS '/blob/'
          AND NOT f.path CONTAINS 'node_modules/' AND NOT f.path CONTAINS '/target/' AND NOT f.path CONTAINS '/build/'
        RETURN sp.key AS project, f.path AS path,
               replace(replace(f.link, 'https://github.com/', 'https://raw.githubusercontent.com/'), '/blob/', '/') AS raw
        LIMIT 2000
    document:
      url: "{{ raw }}"
      sourceKind: project-docs
      tags: [project-docs]
    sync:
      trigger: manual
      prune: true
