# A project's declarations, read by the `source-tree` kind's generic `declarations` emit: the same
# tree-sitter reading every language gets, with no language of its own in the engine. Spring runs on
# the JVM, so the JVM languages the kind reads are named; add one here when the kind gains it.
- { name: springDeclarations, kind: source-tree, emit: declarations, languages: [java, kotlin, scala] }
- { name: springImports, kind: source-tree, emit: imports, languages: [java, kotlin, scala] }

# A Gradle Kotlin DSL build file is Kotlin: its plugins and dependencies are calls, read like any other.
- { name: springBuildCalls, kind: source-tree, emit: calls, languages: [kotlin] }

# Every call in a project's Java, Kotlin and Scala source, by name: what a method does inside a transaction.
- { name: springCalls, kind: source-tree, emit: calls, languages: [java, kotlin, scala] }

# The written documents of a project kept on the Spring page, with their text, to index for search.
- { name: springProjectDocuments, kind: source-tree, emit: documents, maxFileKb: 512 }

# A Gradle build as written, line by line with the block each line is in: Groovy and Kotlin build files, gradle.properties, version catalogues.
- { name: springBuildLines, kind: source-tree, emit: buildFiles }
