# THE RULE CATALOGUE. Each rule is code Spring removed, deprecated or replaced, as data: what to
# match in a project, how bad it is, where it stops working, what to write instead, the OpenRewrite
# recipe that does it, and where Spring documents it. The ModernizationFindings view joins these to
# a project's imports, types, annotations and files; adding a rule is adding a row here.
#
#   kind: import           pattern = an import prefix         (one finding per rule, listing the files)
#         extends          pattern = a supertype's suffix      (one finding per type)
#         annotation       pattern = an annotation's name      (one finding per rule, listing the files)
#         field-annotation pattern = an annotation on a field  (one finding per field)
#         file             pattern = a file name under src/main/resources/META-INF
#   appliesTo: main to skip test sources (an @Autowired field in a test is idiomatic); all when absent
#   excludes: prefixes an import rule does not match (JUnit 5's org.junit.jupiter under JUnit 4's org.junit.)
#   breaksIn: the Spring Boot version from which the code no longer compiles or runs; empty when it
#             still works and the rule is advice.
#
# Every recipe named here was checked against docs.openrewrite.org; a rule with no verified recipe names none.
# Seeded on load (idempotent on ruleId), so the catalogue is a file anyone can read, argue with and extend.

- type: SpringRule
  data: { ruleId: jakarta-persistence, kind: import, pattern: "javax.persistence.", severity: high, category: upgrade-blocker, breaksIn: "3.0",
          title: "javax.persistence → jakarta.persistence", detail: "Spring Boot 3 and Spring Framework 6 use Jakarta EE 9+, where javax.persistence became jakarta.persistence; these imports do not compile there.",
          fix: "Rename the imports to jakarta.persistence.*", recipe: "org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta",
          docs: "https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide#jakarta-ee" }
- type: SpringRule
  data: { ruleId: jakarta-servlet, kind: import, pattern: "javax.servlet.", severity: high, category: upgrade-blocker, breaksIn: "3.0",
          title: "javax.servlet → jakarta.servlet", detail: "Spring Boot 3 runs on Servlet 6 (Jakarta EE 10); javax.servlet does not exist there.",
          fix: "Rename the imports to jakarta.servlet.*", recipe: "org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta",
          docs: "https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide#jakarta-ee" }
