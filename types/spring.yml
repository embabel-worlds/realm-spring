- name: SpringIssue
  visibility: internal
  userAnchor: false
  description: "One issue on GitHub that matches a search, identified by its page `url`, from GitHub's own search. Limited to issues (not pull requests) in the spring-projects organisation, top 15 by relevance; live, cached an hour. Reach it from (:Concept {value:'words'})-[:RELEVANT_TO]->."
  virtualJoins:
    - { anchorLabel: Concept, relationship: RELEVANT_TO, keyField: value, recordKeyField: matchedFor, producer: springIssueSearch,
