  properties:
    url: { identity: true, description: "The issue's page." }
    number: { type: int, description: "Its number in its repository." }
    title: "The issue's title as its author wrote it."
    state: { values: [open, closed], description: "open or closed, as GitHub reports it." }
    createdAt: "When it was opened, ISO-8601 UTC date-time (2024-05-01T09:30:00Z), GitHub's clock."
