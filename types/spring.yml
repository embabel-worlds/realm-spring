# SPRING, over a project realm-java-project reads. Everything below is VIRTUAL — read when a query
# reaches it — except SpringTriage, the one thing this realm keeps: what you decided about a finding.
#
#   (:SpringProduct {slug:'spring-boot'})-[:HAS_GENERATION]->(g:SpringGeneration)   support dates
#   (:SpringProduct {slug:'spring-boot'})-[:HAS_CYCLE]->(c:SupportCycle)            Java per line
#   (d:ProjectDependency)-[:HAS_ADVISORY]->(a:DependencyAdvisory)                    a vulnerability
#   (a)-[:DESCRIBED_BY]->(x:AdvisoryDetail)   (a)-[:FIXED_IN]->(f:AdvisoryFix)
#   (j:ProjectJar)-[:DOCUMENTS]->(p:BootProperty)        what a Spring Boot jar binds
#   (j:ProjectJar)-[:REGISTERS]->(c:BootAutoConfiguration)
#   (:BootBom {coordinates})-[:PINS]->(v:BootManagedVersion)   what a Spring Boot release pins
#   (:BootArtifact {coordinates})-[:IS]->(b:BootJar)-[:DOCUMENTS]->(p:BootProperty)   a release's own jars
#   (:RunningApp {actuator:$json})-[:EVALUATED]->(c:RuntimeCondition)   …BEAN, SETTING, BOUND, MAPS, SHIPS

- name: SpringGeneration
  visibility: internal
  userAnchor: false
  description: "One release line of a Spring project, identified by `name` (`3.5.x`), and when its support ends, from spring.io: open-source support, then commercial. Read live from spring.io, cached a day. Reach it from (:SpringProduct {slug:'spring-boot'})-[:HAS_GENERATION]->."
  virtualJoins:
    - { anchorLabel: SpringProduct, relationship: HAS_GENERATION, keyField: slug, recordKeyField: slug, producer: springGenerations,
        description: "Every release line spring.io lists for one Spring project, with its support end dates: one spring.io call per project slug (spring-boot, spring-framework, …), all lines in it. For 'is my Spring Boot line still supported', pin the slug and compare ossSupportEndDate with today." }
  properties:
    name: { identity: true, description: "The line, e.g. 3.5.x." }
    initialReleaseDate: "The calendar day the line's first release shipped, ISO YYYY-MM-DD, as spring.io publishes it."
    ossSupportEndDate: "The calendar day open-source support ends, ISO YYYY-MM-DD: no more free patch releases after it. A date in the past means the line is out of free support."
    commercialSupportEndDate: "The calendar day commercial (paid) support ends, ISO YYYY-MM-DD; after it no patch is published at all."
    slug: "The Spring project, e.g. spring-boot."
  examples:
    - q: "which Spring Boot lines still get free patches"
      cypher: |
        MATCH (:SpringProduct {slug: 'spring-boot'})-[:HAS_GENERATION]->(g:SpringGeneration)
        WHERE g.ossSupportEndDate >= toString(date())
        RETURN g.name AS line, g.ossSupportEndDate AS ossSupportEnds
        ORDER BY line

- name: SupportCycle
  visibility: internal
  userAnchor: false
  description: "One release cycle of a product from endoflife.date, identified by `cycle` (e.g. 3.5); for Spring Boot it says which Java versions the line supports. Read live, cached a day. Reach it from (:SpringProduct {slug:'spring-boot'})-[:HAS_CYCLE]->."
  virtualJoins:
    - { anchorLabel: SpringProduct, relationship: HAS_CYCLE, keyField: slug, recordKeyField: slug, producer: supportCycles,
        description: "Every release cycle endoflife.date lists for one product, newest first: one call per product slug. Use it for which Java a Spring Boot line supports; for Spring's own support end dates prefer HAS_GENERATION, which is spring.io's word." }
  properties:
    cycle: { identity: true, description: "The cycle, e.g. 3.5." }
    releaseDate: "The calendar day the cycle's first release shipped, ISO YYYY-MM-DD, per endoflife.date."
    eol: "The day support ends, ISO YYYY-MM-DD; a boolean instead when endoflife.date gives no date (false: no end announced, true: ended)."
    extendedSupport: "The day extended (paid) support ends, ISO YYYY-MM-DD, or false/empty when none is offered."
    latest: "The newest release in this cycle, e.g. 3.5.6."
    supportedJavaVersions: "Java versions it supports, e.g. '17 - 25'."
    slug: "The endoflife.date product slug it was read for, e.g. spring-boot."

- name: DependencyAdvisory
  visibility: internal
  userAnchor: false
  description: "One security advisory affecting one exact version of a dependency, from deps.dev, identified by its GHSA `advisoryId`. Its title and CVE ids are on DESCRIBED_BY, the versions that fix it on FIXED_IN. Reach it from a ProjectDependency or a RuntimeComponent via HAS_ADVISORY."
  virtualJoins:
    - { anchorLabel: ProjectDependency, relationship: HAS_ADVISORY, keyField: coordinates, recordKeyField: coordinates, producer: versionAdvisories, maxAnchors: 3000,
        description: "The advisories deps.dev records against the exact version a project resolves: one deps.dev call per distinct groupId:artifactId:version (kept a week), at most 3000 dependencies. A dependency with none has no edge. Then DESCRIBED_BY for the title and CVSS, FIXED_IN for the versions that fix it." }
    - { anchorLabel: RuntimeComponent, relationship: HAS_ADVISORY, keyField: coordinates, recordKeyField: coordinates, producer: versionAdvisories, maxAnchors: 3000,
        description: "The advisories against a component a running app actually shipped (its actuator SBOM): one deps.dev call per distinct version, kept a week. Use this rather than the project's dependencies to ask what is vulnerable in production." }
  properties:
    advisoryId: { identity: true, description: "The GitHub Security Advisory id, e.g. GHSA-4wrc-f8pq-fpqp; CVE ids are on AdvisoryDetail.aliases." }
    coordinates: "The artifact version it affects, groupId:artifactId:version."
  examples:
    # Distinct versions first: a dependency reached by several paths is one lookup, not several.
    - q: "which dependencies of my project have a vulnerability scored 7 or more"
      cypher: |
        MATCH (:JavaProject {key: $project})-[:DEPENDS_ON]->(d:ProjectDependency)
        WHERE d.depth > 0 AND size(split(d.coordinates, ':')) = 3
        WITH DISTINCT d.coordinates AS coordinates, head(collect(d)) AS d
        MATCH (d)-[:HAS_ADVISORY]->(a:DependencyAdvisory)-[:DESCRIBED_BY]->(x:AdvisoryDetail)
        WHERE x.cvss3Score >= 7
        RETURN coordinates, a.advisoryId AS advisory, x.cvss3Score AS cvss, x.title AS title
        ORDER BY cvss DESC
    # A running app's SBOM, given as its JSON, reaches the same advisories through SHIPS.
    - q: "what fixes the advisories in what my running app shipped"
      cypher: |
        MATCH (:RunningApp {actuator: $sbom})-[:SHIPS]->(c:RuntimeComponent)-[:HAS_ADVISORY]->(a:DependencyAdvisory)
        OPTIONAL MATCH (a)-[:FIXED_IN]->(f:AdvisoryFix)
        RETURN c.coordinates AS component, a.advisoryId AS advisory, collect(f.fixed) AS fixedIn

- name: AdvisoryDetail
  visibility: internal
  userAnchor: false
  description: "One advisory's description from deps.dev, identified by its GHSA `advisoryId`: title, CVE aliases, CVSS 3 score and its page. One per DependencyAdvisory; read live, cached a day (an advisory's score or text can be revised)."
  virtualJoins:
    - { anchorLabel: DependencyAdvisory, relationship: DESCRIBED_BY, keyField: advisoryId, recordKeyField: advisoryId, producer: advisoryDetails, maxAnchors: 5000,
        description: "The title, CVE ids and CVSS 3 score of one advisory: one deps.dev call per distinct advisory id, kept a day. Exactly one per advisory. Filter on cvss3Score here to keep only the severe ones." }
  properties:
    advisoryId: { identity: true, description: "The GitHub Security Advisory id, e.g. GHSA-4wrc-f8pq-fpqp." }
    title: "The advisory's one-line title, as published."
    aliases: { cardinality: LIST, description: "CVE ids and other names." }
    cvss3Score: { type: double, description: "CVSS 3 base score, 0–10; 0 or empty when deps.dev has no CVSS 3 vector for it." }
    url: "The advisory's public web page (usually on github.com/advisories)."

- name: AdvisoryFix
  visibility: internal
  userAnchor: false
  description: "One version that fixes an advisory, identified by the version string `fixed`, one per maintenance line affected (from OSV). Upgrade to the fix on your own line — the one that shares your major.minor — when there is one. A fix not on Maven Central (PublishedVersion) is a commercial-only release."
  virtualJoins:
    - { anchorLabel: DependencyAdvisory, relationship: FIXED_IN, keyField: advisoryId, recordKeyField: advisoryId, producer: advisoryFixes, maxAnchors: 5000,
        description: "Every version OSV names as fixing one advisory, one per maintenance line: one OSV call per distinct advisory id, kept a day. None when no fix is released yet. Pick the one sharing the dependency's major.minor; check it is downloadable through PUBLISHED." }
  properties:
    fixed: { identity: true, description: "A version that contains the fix, e.g. 6.1.14, as OSV writes it." }
    advisoryId: "The GHSA id of the advisory this version fixes."

- name: BootProperty
  visibility: internal
  userAnchor: false
  description: "One configuration property a Spring Boot jar documents, identified by `id` (the jar and the property name) (spring-configuration-metadata.json): type, default, description, and Spring's own deprecation — `deprecationLevel` warning (still binds) or error (removed), with its `replacement`. Reach it from a ProjectJar or a BootJar via DOCUMENTS."
  virtualJoins:
    - { anchorLabel: ProjectJar, relationship: DOCUMENTS, keyField: jarPath, recordKeyField: anchorKey, producer: bootProperties,
        description: "Every property one jar a project resolves documents in its spring-configuration-metadata.json, read from the jar in the world's repository; a jar with no metadata has none. Answers 'does Spring Boot bind this setting in the version I use, and is it deprecated'." }
    - { anchorLabel: BootJar, relationship: DOCUMENTS, keyField: jarPath, recordKeyField: anchorKey, producer: bootProperties,
        description: "Every property one Spring Boot release's own jar documents: read for a TARGET version, to see what a property becomes after an upgrade. For the project's current version use the ProjectJar path." }
  properties:
    id: { identity: true, description: "Jar and property name." }
    name: "The property, e.g. spring.data.redis.host."
    type: "The Java type it binds to, fully qualified, e.g. `java.lang.String` or `java.time.Duration`; a java.util.Map type takes keys below its name. Open-ended."
    description: "What it does."
    defaultValue: "The value Spring Boot uses when nothing sets it, as the metadata writes it; empty when none is documented."
    sourceType: "The @ConfigurationProperties class that binds it."
    deprecated: { type: boolean, description: "True when Spring Boot's metadata marks the property deprecated at either level." }
    deprecationLevel: "warning (deprecated, still binds) or error (removed, no longer binds); meaningful only when deprecated is true."
    replacement: "The property to use instead."
    deprecationReason: "Spring's own explanation of the deprecation, as the metadata writes it; empty when it gives none."
    deprecatedSince: "The Spring Boot VERSION it was deprecated in, e.g. 3.2.0 — a version string, not a date; empty when the metadata does not say."
    jarPath: "The jar that documents it."

- name: BootAutoConfiguration
  visibility: internal
  userAnchor: false
  description: "One auto-configuration class a Spring Boot jar registers, identified by `id` (the jar and the class), read from the jar's AutoConfiguration.imports (Boot 2.7+) or spring.factories."
  virtualJoins:
    - { anchorLabel: ProjectJar, relationship: REGISTERS, keyField: jarPath, recordKeyField: anchorKey, producer: bootAutoConfigurations,
        description: "Every auto-configuration one jar a project resolves registers: what Spring Boot may configure for it. Whether each one actually applied is a runtime question — RunningApp EVALUATED." }
  properties:
    id: { identity: true, description: "Jar and class." }
    name: "The auto-configuration class."
    simpleName: "The class name without its package, e.g. DataSourceAutoConfiguration."
    registeredIn: "imports (Boot 2.7+) or spring.factories."

- name: BootManagedVersion
  visibility: internal
  userAnchor: false
  description: "One version a Spring Boot release's BOM pins, identified by `id` (the BOM and the managed coordinates). Pin the BOM by its coordinates: (:BootBom {coordinates:'org.springframework.boot:spring-boot-dependencies:3.5.6'})-[:PINS]->."
  virtualJoins:
    - { anchorLabel: BootBom, relationship: PINS, keyField: coordinates, recordKeyField: anchorKey, producer: bootManaged,
        description: "Every version one Spring Boot release's BOM (spring-boot-dependencies) manages, read from the POM: pin the BOM by its full coordinates, version included. Compare with what a project resolves to find its overrides." }
  properties:
    id: { identity: true, description: "BOM and coordinates." }
    coordinates: "groupId:artifactId:version."
    groupId: "Maven groupId."
    artifactId: "Maven artifactId."
    version: "The version that Spring Boot release pins."

- name: BootJar
  visibility: internal
  userAnchor: false
  description: "One Spring Boot artifact of one release, identified by its coordinates (`id`), downloaded so its jar can be read. Pin it by coordinates — (:BootArtifact {coordinates:'org.springframework.boot:spring-boot-autoconfigure:3.5.6'})-[:IS]->(b:BootJar) — or reach every jar a release pins from its BOM."
  virtualJoins:
    - { anchorLabel: BootArtifact, relationship: IS, keyField: coordinates, recordKeyField: anchorKey, producer: bootArtifact,
        description: "The one jar for exact groupId:artifactId:version coordinates, downloaded from the operator's Maven repositories into the world's repository the first time. Then DOCUMENTS for the properties that version binds." }
    - { anchorLabel: BootManagedVersion, relationship: IS, keyField: coordinates, recordKeyField: anchorKey, producer: bootArtifact,
        description: "(:BootBom {coordinates})-[:PINS]->(v:BootManagedVersion)-[:IS]->(b:BootJar): a release's own Spring Boot jars, downloaded" }
  properties:
    id: { identity: true, description: "Coordinates." }
    coordinates: "groupId:artifactId:version."
    version: "The Spring Boot release the jar belongs to, e.g. 3.5.6."
    jarPath: "The jar, in the world's repository."

- name: RuntimeCondition
  visibility: internal
  userAnchor: false
  description: "One condition Spring evaluated for a configuration in a running app (/actuator/conditions), identified by `key` (context, configuration, outcome and index), with Spring's own message. A configuration that did not apply has configurationMatched false; its notMatched rows say why. Anchor: (:RunningApp {actuator: <the endpoint's JSON, or its URL>})-[:EVALUATED]->."
  virtualJoins:
    - { anchorLabel: RunningApp, relationship: EVALUATED, keyField: actuator, recordKeyField: anchorKey, producer: runtimeConditions,
        description: "Every condition in one /actuator/conditions report, given as its JSON (or its URL where the operator allows private addresses); nothing is cached beyond the query. Answers 'why was this bean or auto-configuration not created': filter configurationMatched = false and read message." }
  properties:
    key: { identity: true, description: "Context, configuration, outcome and index." }
    configuration: "The configuration, e.g. DataSourceAutoConfiguration or X#beanMethod."
    # P2 (money or measure) is a false positive: the audit's heuristic reads "ratio" inside "configuration".
    configurationClass: "The fully qualified class of the configuration, without any #beanMethod suffix."
    beanMethod: "The @Bean method, for a bean method's conditions."
    condition: "The condition, e.g. OnClassCondition."
    message: "Spring's own explanation."
    outcome: "matched, notMatched or unconditional."
    configurationMatched: { type: boolean, description: "Whether the configuration applied." }

- name: RuntimeBean
  visibility: internal
  userAnchor: false
  description: "One bean in a running app (/actuator/beans), identified by `key` (context and bean name): type, the class a proxy wraps, scope, where it was defined, what it depends on. Anchor: (:RunningApp {actuator})-[:HAS_BEAN]->."
  virtualJoins:
    - { anchorLabel: RunningApp, relationship: HAS_BEAN, keyField: actuator, recordKeyField: anchorKey, producer: runtimeBeans,
        description: "Every bean in one /actuator/beans report, across its contexts: what the app actually created, which may differ from what the source declares (Beans view)." }
  properties:
    key: { identity: true, description: "Context and bean name." }
    name: "Bean name."
    type: "The bean's type as /actuator/beans reports it, fully qualified, e.g. `com.example.OrderService` or a proxy class like `jdk.proxy2.$Proxy87`; open-ended."
    targetType: "The class it is, behind a CGLIB proxy."
    simpleType: "Simple name of targetType."
    scope: "singleton, prototype, …"
    resource: "Where it was defined."
    dependencies: { cardinality: LIST, description: "Beans it depends on." }

- name: RuntimeSetting
  visibility: internal
  userAnchor: false
  description: "One property in a running app's environment (/actuator/env), identified by `key` (source index and name), one row per property source in precedence order; `effective` marks the source whose value Spring uses. Anchor: (:RunningApp {actuator})-[:HAS_SETTING]->."
  virtualJoins:
    - { anchorLabel: RunningApp, relationship: HAS_SETTING, keyField: actuator, recordKeyField: anchorKey, producer: runtimeEnvironment,
        description: "Every property in every property source of one /actuator/env report, in precedence order; a property set in two sources has two rows. Filter effective = true for the value Spring uses." }
  properties:
    key: { identity: true, description: "Source index and name." }
    name: "Property name."
    value: "The value as its source writes it, a string in the property's own form (a duration '30s', a size in MB); '******' when the app masks it."
    source: "The property source."
    origin: "Where in it, e.g. 'class path resource [application.yml] - 3:9'."
    effective: { type: boolean, description: "The value Spring uses." }
    masked: { type: boolean, description: "Masked by the app." }

- name: RuntimeMapping
  visibility: internal
  userAnchor: false
  description: "One request mapping in a running app (/actuator/mappings), identified by `key` (context, dispatcher and index), and the handler method it reaches. Anchor: (:RunningApp {actuator})-[:MAPS]->."
  virtualJoins:
    - { anchorLabel: RunningApp, relationship: MAPS, keyField: actuator, recordKeyField: anchorKey, producer: runtimeMappings,
        description: "Every request mapping in one /actuator/mappings report and the handler it reaches: what the running app serves, as against the endpoints the source declares (Endpoints view)." }
  properties:
    key: { identity: true, description: "Context, dispatcher and index." }
    patterns: { cardinality: LIST, description: "URL patterns." }
    methods: { cardinality: LIST, description: "HTTP methods." }
    className: "Handler class."
    methodName: "Handler method."

- name: RuntimeComponent
  visibility: internal
  userAnchor: false
  description: "One component of what actually shipped (/actuator/sbom/application), identified by its purl `key`, as Maven coordinates — so it reaches HAS_ADVISORY like a project dependency. Anchor: (:RunningApp {actuator})-[:SHIPS]->."
  virtualJoins:
    - { anchorLabel: RunningApp, relationship: SHIPS, keyField: actuator, recordKeyField: anchorKey, producer: runtimeComponents,
        description: "Every component in one /actuator/sbom/application report: what is in the running artifact, which can differ from what the build resolves. Then HAS_ADVISORY for what is vulnerable in production." }
  properties:
    key: { identity: true, description: "The component's package URL (purl), e.g. pkg:maven/org.springframework/spring-core@6.2.8." }
    coordinates: "groupId:artifactId:version."
    licenses: { cardinality: LIST, description: "The licence ids the app's SBOM records for the component (SPDX where it uses SPDX); empty when it records none." }
    isApplication: { type: boolean, description: "The application itself." }

- name: PublishedVersion
  visibility: internal
  userAnchor: false
  description: "One version of an artifact, identified by its coordinates (`id`), that the repositories this appliance searches (Maven Central unless the operator configured others) publish. Pin the artifact by groupId:artifactId: (:PublishedArtifact {ga:'org.springframework:spring-core'})-[:PUBLISHED]->(v:PublishedVersion). A fix that is not here is a commercial-only release."
  virtualJoins:
    - { anchorLabel: PublishedArtifact, relationship: PUBLISHED, keyField: ga, recordKeyField: anchorKey, producer: publishedVersions, maxFanoutTotal: 60000, maxAnchors: 3000,
        description: "Every version the configured Maven repositories publish for one groupId:artifactId, read from its maven-metadata.xml: one read per artifact. Answers 'can this fix be downloaded' and 'what is the newest version' (latest = true)." }
  properties:
    id: { identity: true, description: "Coordinates." }
    version: "The version string alone, e.g. 6.2.18, as the repository's metadata lists it."
    latest: { type: boolean, description: "True on the highest version the repositories publish for the artifact; false on every other." }

- name: SpringRule
  userAnchor: false
  description: "One rule of the realm's catalogue (reference/rules.yml), identified by `ruleId`: code Spring removed, deprecated or replaced — what to match (`kind`, `pattern`), how bad, from which Spring Boot version it breaks (`breaksIn`), what to write instead, the OpenRewrite recipe that does it, and where Spring documents it."
  properties:
    ruleId: { identity: true, description: "The rule's short stable name, e.g. jakarta-persistence; a finding's id is built from it." }
    kind: { values: [import, extends, annotation, field-annotation, file], description: "What the pattern matches: an import prefix, a supertype, an annotation, an annotated field, or a file." }
    pattern: "An import prefix, a supertype's suffix, an annotation's name, or a file name."
    excludes: { cardinality: LIST, description: "Import prefixes the rule does not match." }
    appliesTo: "main to skip test sources; absent for all."
    severity: "critical, high, medium, low or info."
    category: "upgrade-blocker, design, testing or modernize in the shipped catalogue; a rule someone adds may name another."
    breaksIn: "The Spring Boot version from which the code no longer compiles or runs; empty for advice."
    title: "What it is."
    detail: "Why it matters."
    fix: "What to write instead."
    recipe: "The OpenRewrite recipe that makes the change; empty when none is verified."
    docs: "Where Spring documents it."

# The one thing this realm keeps: what you decided about a finding in the debt inbox.
- name: SpringTriage
  description: "A decision about one finding in a project's debt inbox: done, snoozed, or won't fix, with a note. `findingId` is the finding's id as the DebtInbox view gives it."
  properties:
    findingId: { identity: true, description: "The id the Spring Stack page's debt inbox gives the finding, e.g. config:<path>:<line>:<property>." }
    project: "The project key the finding was raised for."
    status: "done, snoozed, wontfix, or reopened (a decision taken back that could not be deleted)."
    title: "The finding's title when it was decided, so the decision reads on its own."
    note: "The reason given for the decision, in the person's words; asked for on won't fix, often empty otherwise."

# The projects you have analyzed, so the page can list yours first. Only the key and what the last
# read found are kept; nothing of the project's code is.
- name: SpringProject
  description: "A project someone analyzed on the Spring Stack page: its key, and what the last read found. Kept so the page lists your projects; removed when you remove it there."
  properties:
    key: { identity: true, description: "The project key, as entered: a repository URL, optionally @ref, or a folder." }
    name: "A short name for it: owner/repo, or the folder."
    bootVersion: "The Spring Boot version the last read found; empty when none."
    support: "supported, commercial-only, unsupported or unknown, at the last read."
    read: "What was read: host/repo@commit, or the folder."
    modules: { type: int, description: "Maven modules at the last read." }
    analysedAt: "When it was last read, ISO-8601."
    failed: { type: int, description: "How many of the page's checks could not complete at the last read." }

# What the source declares, in whatever JVM language it is written. Beans, endpoints, transactions
# and background work are all "a declaration carrying a certain annotation", so they read this one
# join and nothing that knows a language.
- name: SpringDeclaration
  parents: [SourceDeclaration]
  visibility: internal
  userAnchor: false
  description: "One class, object, interface, function, method or field a project declares in Java, Kotlin or Scala, identified by `id` (file, kind, name and first line), with its annotations by name (`annotations`) and as written (`annotationText`). Reach it from (:JavaProject {key})-[:DECLARES_SOURCE]->."
  virtualJoins:
    - { anchorLabel: JavaProject, relationship: DECLARES_SOURCE, keyField: key, recordKeyField: anchorKey, producer: springDeclarations, maxFanoutTotal: 500000,
        description: "(:JavaProject {key:$project})-[:DECLARES_SOURCE]->(d:SpringDeclaration)" }
  properties:
    id: { identity: true, description: "The file's id, `#`, the kind, name and first line." }
    path: "File path, relative to the project."
    language: "java, kotlin or scala."
    line: { type: int, description: "Line it is on." }
    url: "The line on the repository's host, when it has a file view."
    project: "The project as read: the folder, or host/repo@commit."

- name: SpringImport
  parents: [SourceImport]
  visibility: internal
  userAnchor: false
  description: "One import in a project's Java, Kotlin or Scala source, as the file writes it, identified by `id` (file, line and column). Reach it from (:JavaProject {key})-[:IMPORTS_SOURCE]->."
  virtualJoins:
    - { anchorLabel: JavaProject, relationship: IMPORTS_SOURCE, keyField: key, recordKeyField: anchorKey, producer: springImports, maxFanoutTotal: 500000,
