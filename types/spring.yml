  visibility: internal
  userAnchor: false
  description: "One call in a project's Kotlin source, build files included, identified by `id` (file, line and column): what a Gradle Kotlin DSL build declares (plugins, dependencies) is read from these. Reach it from (:JavaProject {key})-[:BUILD_CALLS]->."
