- name: SpringDocHit
  visibility: internal
  userAnchor: false
  description: "A passage of Spring's own documentation (upgrade and migration guides, release notes, key reference pages) found by MEANING from free text; the matching passage is `snippet` on the RELEVANT_TO edge, with `score` and `mode`. Always narrow to this index: WHERE 'spring-docs' IN h.tags. The SpringDocs view does."
  virtualJoins:
    - { anchorLabel: Concept, relationship: RELEVANT_TO, via: vector, keyField: value, recordKeyField: matchedFor, producer: springDocsVector,
