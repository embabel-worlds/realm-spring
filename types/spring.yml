    - { anchorLabel: Concept, relationship: RELEVANT_TO, via: keyword, keyField: value, recordKeyField: matchedFor, producer: springDocsKeyword,
        description: "Documentation whose words match a phrase, with via:'keyword' on the edge." }
  properties:
    id: { identity: true, description: "The passage's id." }
    uri: "The page it is from."
    title: "The page's title."
    tags: { cardinality: LIST, description: "`spring-docs` for every passage of this index." }

