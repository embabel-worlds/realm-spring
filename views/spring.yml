# What a Spring project declares and how it is configured, and the findings that come from its
# configuration, its dependencies and its versions. Every view takes `project`; the findings come
# in the shape findings.yml describes, so the debt inbox is their union.

- name: Beans
  description: >-
    Every bean the project's source declares, with its profiles and conditions.
    Every bean the project's source declares, in Java, Kotlin or Scala: classes annotated
    @Component, @Service, @Repository, @Controller, @RestController, @Configuration,
    @SpringBootApplication or a controller advice, Spring Data repository interfaces, OpenFeign clients (@FeignClient), and @Bean methods — each with the profiles and conditions written on it or on its class,
    and a link to its line. What the source says; a running app's RuntimeBeans says what was
    actually created. Test source is left out.
    Beans from libraries and auto-configuration are not listed.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:DECLARES_SOURCE]->(d:SpringDeclaration)
    WHERE NOT d.path CONTAINS 'src/test/'
      AND (ANY(a IN d.annotations WHERE a IN ['Component', 'Service', 'Repository', 'Controller', 'RestController', 'Configuration', 'Bean', 'ControllerAdvice', 'RestControllerAdvice', 'SpringBootApplication', 'FeignClient']
                                        OR ANY(g IN ['Profile', 'Conditional'] WHERE a STARTS WITH g))
           OR (d.kind = 'interface' AND d.signature CONTAINS 'Repository<'))
    // One pass: the beans, and the classes that carry a profile or a condition their @Bean methods inherit.
    WITH [x IN collect(d) WHERE x.kind IN ['class', 'object', 'interface'] AND ANY(a IN x.annotations WHERE a = 'Profile' OR a STARTS WITH 'Conditional')
          | {path: x.path, name: x.name, text: x.annotationText}] AS gates,
         [x IN collect(d) WHERE ANY(a IN x.annotations WHERE a IN ['Component', 'Service', 'Repository', 'Controller', 'RestController', 'Configuration', 'Bean', 'ControllerAdvice', 'RestControllerAdvice', 'SpringBootApplication', 'FeignClient']) OR (x.kind = 'interface' AND x.signature CONTAINS 'Repository<')] AS beans
    UNWIND beans AS d
    WITH d, coalesce([a IN d.annotations WHERE a IN ['Bean', 'SpringBootApplication', 'Configuration', 'RestController', 'Controller', 'RestControllerAdvice', 'ControllerAdvice', 'Service', 'Repository', 'Component', 'FeignClient']][0], 'Spring Data repository') AS stereotype,
         d.annotationText + reduce(acc = [], g IN [x IN gates WHERE x.path = d.path AND x.name = last(split(coalesce(d.owner, ''), '.'))] | acc + g.text) AS written
    RETURN CASE WHEN stereotype = 'Bean' THEN coalesce(d.owner, '') + '#' + d.name ELSE CASE WHEN coalesce(d.owner, '') = '' THEN d.name ELSE d.owner + '.' + d.name END END AS bean,
           CASE WHEN stereotype = 'Bean' THEN '@Bean method' WHEN stereotype = 'Spring Data repository' THEN stereotype ELSE '@' + stereotype END AS declaredBy,
           [t IN written WHERE t STARTS WITH '@Profile' AND t CONTAINS '"' | split(t, '"')[1]] AS profiles,
           [t IN written WHERE t STARTS WITH '@Conditional'] AS conditions,
           d.language AS language,
           CASE WHEN ('/' + d.path) CONTAINS '/src/' THEN substring(split('/' + d.path, '/src/')[0], 1) ELSE '' END AS module,
           d.path AS file, d.line AS line, d.url AS link
    ORDER BY declaredBy, bean LIMIT 5000

- name: Profiles
  description: >-
    Every Spring profile the project uses, and where it is used.
    Every Spring profile the project uses and where: @Profile on classes and @Bean methods,
    application-<profile> files, and YAML documents activated on a profile.
    A profile activated only at run time (spring.profiles.active from the environment) is not seen.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_ANNOTATION]->(a:JavaProjectAnnotation {name: 'Profile'})
    UNWIND a.values AS profile
    RETURN profile, 'code' AS where, coalesce(a.owner + '#' + a.targetName, a.targetName) AS what, a.path AS file, a.line AS line, a.link AS link
    UNION
    MATCH (p:JavaProject {key: $project})-[:HAS_FILE]->(f:ProjectFile)
    WHERE f.fileName STARTS WITH 'application-' AND f.extension IN ['yml', 'yaml', 'properties']
    RETURN split(split(f.fileName, 'application-')[1], '.')[0] AS profile, 'file' AS where, f.fileName AS what, f.path AS file, 1 AS line, f.link AS link
    UNION
    MATCH (p:JavaProject {key: $project})-[:HAS_SETTING]->(s:ProjectSetting)
    WHERE s.name IN ['spring.config.activate.on-profile', 'spring.profiles']
    RETURN s.value AS profile, 'document' AS where, s.fileName + ' document ' + toString(s.document) AS what, s.path AS file, s.line AS line, s.link AS link

- name: ConfigurationProblems
  description: >-
    Settings the project's Spring Boot does not bind, or has deprecated.
    Settings in the project's application*.yml / .properties that the Spring Boot it runs does not
    bind (a typo, or a property from another version), and settings it has deprecated — checked
    against what the project's own Spring Boot jars document. Keys under the project's own
    @ConfigurationProperties prefixes, or read as ${key} by any annotation (@Value, @Scheduled's
    cron, a @FeignClient's url), are the project's and are not flagged.
    Also: a value that is not what the property's documented type takes (a boolean, whole number, duration or size), which stops the application starting. A value holding a ${placeholder} is not checked. Downloads the project's Spring Boot jars the first time.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    /*
     * The settings are read first and the jars' documented properties last. Read the other way round the statement
     * stops on the engine's work budget on a large project (18,000 settings across a repository, 390 jars), though
     * nothing here builds a string for each of them: an engine defect, found on embabel/me, that this order avoids.
     */
    MATCH (p:JavaProject {key: $project})-[:HAS_SETTING]->(s:ProjectSetting)
    WHERE s.path CONTAINS 'src/main/resources' AND NOT s.path CONTAINS '/META-INF/'
      AND NOT s.fileName STARTS WITH 'messages' AND NOT s.fileName STARTS WITH 'logback' AND NOT s.fileName STARTS WITH 'log4j'
      AND NOT s.fileName STARTS WITH 'git.' AND NOT s.fileName STARTS WITH 'ValidationMessages' AND NOT s.fileName STARTS WITH '.'
      AND NOT s.name IN ['spring.config.activate.on-profile', 'spring.profiles']
    WITH p, collect(s) AS settings
    OPTIONAL MATCH (p)-[:HAS_ANNOTATION]->(cp:JavaProjectAnnotation)
    WHERE cp.name = 'ConfigurationProperties' OR coalesce(cp.value, '') CONTAINS '${' OR ANY(x IN coalesce(cp.attributes, []) WHERE x CONTAINS '${')
    WITH p, settings,
         collect(DISTINCT CASE WHEN cp.name = 'ConfigurationProperties'
                   THEN coalesce([x IN cp.attributes WHERE x STARTS WITH 'prefix=' | substring(x, 7)][0], cp.value) END) AS ownPrefixes,
         /* Every ${key} any annotation reads: @Value, and @Scheduled(cron = "${jobs.cron}"), @FeignClient(url = "${rates.url}") and the rest. */
         collect(CASE WHEN cp.name <> 'ConfigurationProperties' THEN coalesce(cp.value, '') + reduce(t = '', x IN coalesce(cp.attributes, []) | t + ' ' + x) END) AS annotated
    /* The same from Kotlin and Scala, whose annotations are read as written: @ConfigurationProperties("shop") or (prefix = "shop"), and any ${key}. */
    OPTIONAL MATCH (p)-[:DECLARES_SOURCE]->(d:SpringDeclaration)
    WHERE d.language <> 'java' AND NOT d.path CONTAINS 'src/test/' AND ANY(t IN d.annotationText WHERE t CONTAINS 'ConfigurationProperties' OR t CONTAINS '${')
    WITH p, settings, ownPrefixes, annotated,
         collect([t IN d.annotationText WHERE t CONTAINS 'ConfigurationProperties(' AND t CONTAINS '"' | split(t, '"')[1]][0]) AS writtenPrefixes,
         collect(reduce(all = '', t IN [t IN d.annotationText WHERE t CONTAINS '${'] | all + ' ' + t)) AS writtenKeys
    /* The project's own prefixes and keys in their relaxed form, made once. A key another setting reads as ${key} (`classpath:db/${database}/schema.sql`) is in use too. */
    WITH p, settings, [x IN ownPrefixes + writtenPrefixes WHERE x IS NOT NULL | toLower(replace(replace(x, '-', ''), '_', ''))] AS ownPrefixes,
         [x IN reduce(acc = [], text IN annotated + writtenKeys + [y IN settings WHERE coalesce(y.value, '') CONTAINS '${' | y.value] | acc + [k IN split(text, '${')[1..] | split(split(k, '}')[0], ':')[0]])
            | toLower(replace(replace(x, '-', ''), '_', ''))] AS valueKeys
    MATCH (p)-[:HAS_JAR]->(j:ProjectJar)
    WHERE j.jarPath IS NOT NULL AND (j.groupId STARTS WITH 'org.springframework' OR j.artifactId CONTAINS 'spring-boot'
       OR j.artifactId CONTAINS 'starter' OR j.artifactId CONTAINS 'autoconfigure')
    MATCH (j)-[:DOCUMENTS]->(bp:BootProperty)
    /* A multi-module project meets the same jar, and so the same property, once per module: one of each is enough. */
    WITH settings, ownPrefixes, valueKeys, bp.name AS documented, collect(bp)[0] AS bp
    WITH settings, ownPrefixes, valueKeys, collect(bp) AS props
    /* Each documented name in its relaxed form, made once: made inside the comparison below it would be made again for every setting. */
    WITH settings, ownPrefixes, valueKeys, [x IN props | [toLower(replace(replace(x.name, '-', ''), '_', '')), x]] AS props
    WITH settings, ownPrefixes, valueKeys, props,
         [x IN props WHERE x[1].type STARTS WITH 'java.util.Map' OR x[1].type STARTS WITH 'java.util.List' | x[0] + '.'] AS open
    /*
     * Which files are Spring configuration: application* and bootstrap* by name, and any other that sets at least one
     * property Spring Boot documents (a config server's shared files). A YAML file of the project's own data is neither.
     */
    WITH ownPrefixes, valueKeys, props, open, [x IN props | x[0]] AS names,
         [x IN settings | [x, toLower(replace(replace(split(x.name, '[')[0], '-', ''), '_', ''))]] AS settings
    WITH ownPrefixes, valueKeys, props, open, settings, [x IN settings WHERE x[1] IN names | x[0].path] AS springFiles
    UNWIND settings AS pair
    WITH pair[0] AS s, pair[1] AS base, props, open, ownPrefixes, valueKeys, springFiles
    WHERE s.fileName STARTS WITH 'application' OR s.fileName STARTS WITH 'bootstrap' OR s.path IN springFiles
    WITH s, base, ownPrefixes, valueKeys, open, [x IN props WHERE x[0] = base | x[1]][0] AS match
    WHERE NOT ANY(x IN ownPrefixes WHERE base STARTS WITH x + '.' OR base = x)
      AND NOT ANY(x IN valueKeys WHERE base = x)
      AND NOT ANY(x IN open WHERE base STARTS WITH x)
    WITH s, base, match, trim(coalesce(s.value, '')) AS v
    /* What the value must be, when the property's documented type says and the value as written is not one; a ${placeholder} or a build token is settled elsewhere. */
    WITH s, base, match, v,
         CASE WHEN match IS NULL OR v = '' OR v CONTAINS '${' OR v CONTAINS '#{' OR v STARTS WITH '@' THEN null
              WHEN match.type IN ['java.lang.Boolean', 'boolean'] AND NOT toLower(v) IN ['true', 'false', 'on', 'off', 'yes', 'no']
                THEN 'true or false'
              WHEN match.type IN ['java.lang.Integer', 'int', 'java.lang.Long', 'long', 'java.lang.Short', 'short'] AND (toInteger(v) IS NULL OR toString(toInteger(v)) <> v)
                THEN 'a whole number'
              WHEN match.type = 'java.time.Duration' AND NOT ((toInteger(v) IS NOT NULL AND toString(toInteger(v)) = v) OR toUpper(v) STARTS WITH 'P' OR toUpper(v) STARTS WITH '-P' OR toUpper(v) STARTS WITH '+P'
                     OR ANY(u IN ['ns', 'us', 'ms', 's', 'm', 'h', 'd'] WHERE toLower(v) ENDS WITH u AND toInteger(left(v, size(v) - size(u))) IS NOT NULL AND toString(toInteger(left(v, size(v) - size(u)))) = left(v, size(v) - size(u))))
                THEN 'a duration: a number with ns, us, ms, s, m, h or d (30s, 5m), or ISO-8601 (PT30S)'
              WHEN match.type = 'org.springframework.util.unit.DataSize' AND NOT ((toInteger(v) IS NOT NULL AND toString(toInteger(v)) = v)
                     OR ANY(u IN ['b', 'kb', 'mb', 'gb', 'tb'] WHERE toLower(v) ENDS WITH u AND toInteger(left(v, size(v) - size(u))) IS NOT NULL AND toString(toInteger(left(v, size(v) - size(u)))) = left(v, size(v) - size(u))))
                THEN 'a size: a number with B, KB, MB, GB or TB (10MB)'
              END AS expected
    WHERE match IS NULL OR match.deprecated OR expected IS NOT NULL
    RETURN 'config:' + s.path + ':' + toString(s.line) + ':' + s.name AS id,
           CASE WHEN expected IS NOT NULL THEN 'high'
                WHEN match IS NULL AND split(base, '.')[0] IN ['spring', 'server', 'management', 'logging', 'info', 'debug', 'trace'] THEN 'medium'
                WHEN match IS NULL THEN 'low' WHEN match.deprecationLevel = 'error' THEN 'high' ELSE 'low' END AS severity,
           'configuration' AS category,
           CASE WHEN expected IS NOT NULL THEN s.name + ' is "' + left(v, 60) + '", which is not ' + split(expected, ':')[0]
                WHEN match IS NULL AND split(base, '.')[0] IN ['spring', 'server', 'management', 'logging', 'info', 'debug', 'trace'] THEN 'Spring Boot binds no property ' + s.name
                WHEN match IS NULL THEN 'Undocumented setting ' + s.name
                WHEN match.deprecationLevel = 'error' THEN s.name + ' no longer binds'
                ELSE s.name + ' is deprecated' END AS title,
           CASE WHEN expected IS NOT NULL THEN 'Spring Boot binds this property as ' + last(split(match.type, '.')) + ' and cannot convert the value, so the application fails to start with a binding error.' + CASE WHEN match.deprecated THEN ' The property is also deprecated.' ELSE '' END
                WHEN match IS NULL THEN 'No Spring Boot, Spring Cloud or starter jar this project resolves documents it, and no @ConfigurationProperties or @Value in the project reads it. A typo, or a property from another version, does nothing; if the code reads it some other way (Environment.getProperty), dismiss it.'
                WHEN match.deprecationLevel = 'error' THEN 'Spring Boot removed it' + coalesce(' in ' + match.deprecatedSince, '') + ': the setting is silently ignored.' + coalesce(' ' + match.deprecationReason, '')
                ELSE coalesce(match.deprecationReason, 'Deprecated') + coalesce(' (since ' + match.deprecatedSince + ')', '') + '; it still binds, for now.' END AS detail,
           CASE WHEN expected IS NOT NULL THEN 'Set it to ' + expected + '.' + coalesce(' The default is ' + toString(match.defaultValue) + '.', '')
                WHEN match IS NULL THEN 'Check the spelling against the Spring Boot reference, or remove it.'
                WHEN match.replacement IS NOT NULL THEN 'Use ' + match.replacement + ' instead.'
                ELSE 'Remove it.' END AS fix,
           s.path AS file, s.line AS line, s.link AS link
    LIMIT 500

- name: UpgradeConfiguration
  description: >-
    Settings the target Spring Boot version removed or renamed, with the new ones.
    Settings in the project that the target Spring Boot version removed or renamed, each with the
    property to use there — read from the target release's own jars, which document every property
    they dropped with its replacement. `target` is a Spring Boot version, e.g. 3.5.16 or 4.1.2.
    Downloads the target's Spring Boot jars the first time.
  params:
    project: { type: string, required: true, description: "Project key." }
    target: { type: string, required: true, description: "Target Spring Boot version, e.g. 3.5.16." }
  cypher: |
    MATCH (bom:BootBom {coordinates: 'org.springframework.boot:spring-boot-dependencies:' + $target})-[:PINS]->(v:BootManagedVersion)
    WHERE v.groupId = 'org.springframework.boot' AND v.artifactId STARTS WITH 'spring-boot'
      AND NOT v.artifactId CONTAINS 'starter' AND NOT v.artifactId CONTAINS 'test' AND NOT v.artifactId ENDS WITH '-docs'
    MATCH (v)-[:IS]->(b:BootJar)-[:DOCUMENTS]->(bp:BootProperty)
    WHERE bp.deprecated
    WITH collect(bp) AS dropped
    MATCH (p:JavaProject {key: $project})-[:HAS_SETTING]->(s:ProjectSetting)
    WHERE s.path CONTAINS 'src/main/resources' AND NOT s.path CONTAINS '/META-INF/'
      AND NOT s.fileName STARTS WITH 'messages' AND NOT s.fileName STARTS WITH 'logback' AND NOT s.fileName STARTS WITH 'log4j'
      AND NOT s.fileName STARTS WITH 'git.' AND NOT s.fileName STARTS WITH 'ValidationMessages'
    WITH s, [x IN dropped WHERE toLower(replace(replace(x.name, '-', ''), '_', '')) = toLower(replace(replace(split(s.name, '[')[0], '-', ''), '_', ''))][0] AS match
    WHERE match IS NOT NULL
    RETURN 'upgrade-config:' + $target + ':' + s.path + ':' + toString(s.line) + ':' + s.name AS id,
           CASE WHEN match.deprecationLevel = 'error' THEN 'high' ELSE 'low' END AS severity,
           'upgrade-blocker' AS category,
           CASE WHEN match.deprecationLevel = 'error' THEN s.name + ' is gone in Spring Boot ' + $target
                ELSE s.name + ' is deprecated in Spring Boot ' + $target END AS title,
           coalesce(match.deprecationReason + '. ', '') + CASE WHEN match.deprecationLevel = 'error' THEN 'It no longer binds there: the setting is silently ignored.' ELSE 'It still binds, for now.' END AS detail,
           CASE WHEN match.replacement IS NOT NULL THEN 'Rename it to ' + match.replacement + '.' ELSE 'Remove it.' END AS fix,
           s.path AS file, s.line AS line, s.link AS link
    LIMIT 500

- name: Vulnerabilities
  description: >-
    Advisories against the exact versions a project resolves, worst first.
    Security advisories affecting the exact versions the project resolves, worst first: the
    dependency, the advisory and its CVE ids, its CVSS score, and the fixed version on your own
    line (same major.minor) when there is one — else the nearest fix above it.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:DEPENDS_ON]->(d:ProjectDependency)
    WHERE d.depth > 0 AND size(split(d.coordinates, ':')) = 3
    WITH DISTINCT d.coordinates AS coordinates, d.version AS version, d.groupId + ':' + d.artifactId AS artifact, head(collect(d)) AS d
    MATCH (d)-[:HAS_ADVISORY]->(a:DependencyAdvisory)-[:DESCRIBED_BY]->(x:AdvisoryDetail)
    OPTIONAL MATCH (a)-[:FIXED_IN]->(f:AdvisoryFix)
    WITH coordinates, version, artifact, a, x, collect(f.fixed) AS fixes,
         split(version, '.')[0] + '.' + split(version, '.')[1] AS line
    WITH coordinates, version, artifact, a, x, fixes, line,
         [v IN fixes WHERE split(v, '.')[0] + '.' + split(v, '.')[1] = line][0] AS onLine
    RETURN 'cve:' + coordinates + ':' + a.advisoryId AS id,
           CASE WHEN x.cvss3Score >= 9 THEN 'critical' WHEN x.cvss3Score >= 7 THEN 'high' WHEN x.cvss3Score >= 4 THEN 'medium' ELSE 'low' END AS severity,
           'vulnerability' AS category,
           artifact + ' ' + version + ': ' + x.title AS title,
           a.advisoryId + coalesce(' / ' + [y IN x.aliases WHERE y STARTS WITH 'CVE-'][0], '') + ', CVSS ' + toString(x.cvss3Score) AS detail,
           CASE WHEN onLine IS NOT NULL THEN 'Upgrade to ' + onLine + ' (same line).'
                WHEN size(fixes) > 0 THEN 'Fixed in ' + reduce(s = '', v IN fixes | s + CASE WHEN s = '' THEN '' ELSE ', ' END + v) + ' — no fix on your ' + line + ' line.'
                ELSE 'No fixed version is published yet.' END AS fix,
           coordinates AS file, 0 AS line, x.url AS link, x.cvss3Score AS cvss
    ORDER BY cvss DESC LIMIT 500

- name: VulnerableDependencies
  description: >-
    One finding per vulnerable dependency, with the one upgrade that fixes it.
    One finding per vulnerable dependency rather than per advisory: how many advisories affect the
    exact version resolved, the worst CVSS, and the one upgrade on your own line (same major.minor)
    that fixes every advisory that has a fix there — the unit of work a developer actually does.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:DEPENDS_ON]->(d:ProjectDependency)
    WHERE d.depth > 0 AND size(split(d.coordinates, ':')) = 3
    WITH DISTINCT d.coordinates AS coordinates, d.version AS version, d.groupId + ':' + d.artifactId AS artifact, head(collect(d)) AS d
    MATCH (d)-[:HAS_ADVISORY]->(a:DependencyAdvisory)-[:DESCRIBED_BY]->(x:AdvisoryDetail)
    OPTIONAL MATCH (a)-[:FIXED_IN]->(f:AdvisoryFix)
    WITH coordinates, version, artifact, a, x, collect(f.fixed) AS fixes, split(version, '.')[0] + '.' + split(version, '.')[1] AS line
    OPTIONAL MATCH (:PublishedArtifact {ga: artifact})-[:PUBLISHED]->(pv:PublishedVersion)
    WITH coordinates, version, artifact, a, x, fixes, line, collect(pv.version) AS published
    WITH coordinates, version, artifact, a, x, line, published,
         [v IN fixes WHERE split(v, '.')[0] + '.' + split(v, '.')[1] = line][0] AS onLine
    WITH coordinates, version, artifact, line, published, count(a) AS advisories, max(x.cvss3Score) AS worst,
         collect(onLine) AS onLineFixes, collect(CASE WHEN x.cvss3Score >= 9 THEN 1 END) AS crit
    WITH coordinates, version, artifact, line, advisories, worst, size([c IN crit WHERE c IS NOT NULL]) AS critical,
         [v IN onLineFixes WHERE v IS NOT NULL] AS fixed, [v IN onLineFixes WHERE v IS NOT NULL AND v IN published] AS downloadable,
         size(published) > 0 AS knowsPublished
    WITH coordinates, version, artifact, line, advisories, worst, critical, fixed, downloadable, knowsPublished,
         reduce(best = null, v IN (CASE WHEN knowsPublished THEN downloadable ELSE fixed END) |
           CASE WHEN best IS NULL OR [n IN [x IN split(v, '.') | toInteger(x)] WHERE n IS NOT NULL] > [n IN [x IN split(best, '.') | toInteger(x)] WHERE n IS NOT NULL] THEN v ELSE best END) AS upgradeTo,
         reduce(best = null, v IN fixed |
           CASE WHEN best IS NULL OR [n IN [x IN split(v, '.') | toInteger(x)] WHERE n IS NOT NULL] > [n IN [x IN split(best, '.') | toInteger(x)] WHERE n IS NOT NULL] THEN v ELSE best END) AS anyFix
    WITH coordinates, version, artifact, line, advisories, worst, critical, upgradeTo, anyFix, size(fixed) AS fixedOnLine,
         CASE WHEN upgradeTo IS NULL THEN 0 ELSE size([v IN fixed WHERE [n IN [x IN split(v, '.') | toInteger(x)] WHERE n IS NOT NULL] <= [n IN [x IN split(upgradeTo, '.') | toInteger(x)] WHERE n IS NOT NULL]]) END AS coveredBy
    RETURN 'vulnerable:' + coordinates AS id,
           CASE WHEN worst >= 9 THEN 'critical' WHEN worst >= 7 THEN 'high' WHEN worst >= 4 THEN 'medium' ELSE 'low' END AS severity,
           'vulnerability' AS category,
           artifact + ' ' + version + ': ' + toString(advisories) + ' advisor' + CASE WHEN advisories = 1 THEN 'y' ELSE 'ies' END
             + CASE WHEN critical > 0 THEN ' (' + toString(critical) + ' critical)' ELSE '' END AS title,
           'Worst CVSS ' + toString(worst) + '. ' + toString(fixedOnLine) + ' of ' + toString(advisories) + ' are fixed on your ' + line + ' line'
             + CASE WHEN anyFix IS NOT NULL AND anyFix <> coalesce(upgradeTo, '') THEN '; the fix in ' + anyFix + ' is a commercial-only release, not on Maven Central' ELSE '' END + '.' AS detail,
           CASE WHEN upgradeTo IS NOT NULL THEN 'Upgrade to ' + upgradeTo + ' — fixes ' + toString(coveredBy) + ' of ' + toString(advisories)
                  + CASE WHEN coveredBy < advisories THEN '; the rest need a newer line (see the Upgrade tab).' ELSE '.' END
                WHEN anyFix IS NOT NULL THEN 'No downloadable fix on your ' + line + ' line (' + anyFix + ' is commercial-only): move to a newer line (see the Upgrade tab).'
                ELSE 'No fix on your ' + line + ' line: move to a newer line (see the Upgrade tab).' END AS fix,
           coordinates AS file, 0 AS line, null AS link, worst AS cvss, advisories, upgradeTo
    ORDER BY cvss DESC LIMIT 500

- name: VersionOverrides
  description: >-
    Where the build pins a version other than the one Spring Boot's BOM pins.
    Where the project's build pins a different version than the Spring Boot it runs would — a
    `<jackson-bom.version>` property, a hand-written version on a managed dependency — so a
    patch Spring Boot ships for it never arrives. Compared against the Spring Boot release's own BOM.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:DEPENDS_ON]->(boot:ProjectDependency)
    WHERE boot.groupId = 'org.springframework.boot' AND boot.artifactId = 'spring-boot'
    WITH p, head(collect(boot.version)) AS bootVersion
    MATCH (bom:BootBom {coordinates: 'org.springframework.boot:spring-boot-dependencies:' + bootVersion})-[:PINS]->(v:BootManagedVersion)
    WITH p, bootVersion, collect(v) AS pins
    MATCH (p)-[:MANAGES]->(m:ProjectManagedVersion)
    WITH bootVersion, m, [x IN pins WHERE x.groupId = m.groupId AND x.artifactId = m.artifactId][0] AS pin
    WHERE pin IS NOT NULL AND pin.version <> m.version
    WITH bootVersion, m.version AS mine, pin.version AS boots, collect(DISTINCT m.groupId) AS groups, count(*) AS artifacts
    WITH bootVersion, mine, boots, groups, artifacts, reduce(m = head(groups), g IN groups | CASE WHEN g < m THEN g ELSE m END) AS first
    RETURN 'override:' + mine + ':' + boots + ':' + first AS id, 'medium' AS severity, 'dependencies' AS category,
           first + CASE WHEN size(groups) > 1 THEN ' and ' + toString(size(groups) - 1) + ' related group(s)' ELSE '' END
             + ' pinned to ' + mine + ' (Spring Boot ' + bootVersion + ' manages ' + boots + ')' AS title,
           'Overrides ' + toString(artifacts) + ' managed artifact(s) in ' + reduce(s = '', g IN groups[0..5] | s + CASE WHEN s = '' THEN '' ELSE ', ' END + g)
             + '. Patches Spring Boot ships for them do not reach this build.' AS detail,
           'Remove the version override and take ' + boots + ' from Spring Boot, unless you pinned it on purpose (then note why).' AS fix,
           'pom.xml' AS file, 0 AS line, null AS link

- name: Triage
  description: >-
    Decisions taken on this project's findings: done, snoozed, won't fix.
    Each with the finding's title and the note given.
    Only findings someone decided on; a finding still open has no row.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (t:SpringTriage {project: $project})
    RETURN t.findingId AS findingId, t.status AS status, t.title AS title, t.note AS note
    LIMIT 2000

- name: MyProjects
  description: >-
    Projects analyzed on the Spring Stack page, most recently read first.
    With the Spring Boot version and outcome of the last read. Only projects someone analyzed
    there and has not removed.
  cypher: |
    MATCH (p:SpringProject)
    RETURN p.key AS key, p.name AS name, p.bootVersion AS bootVersion, p.support AS support, p.read AS read,
           p.modules AS modules, p.analysedAt AS analysedAt, p.failed AS failed
    ORDER BY analysedAt DESC LIMIT 200

- name: BeanWiring
  description: >-
    Every injection point the project's source declares, and what fills it.
    SELECT THIS for "what does this bean depend on", "what uses OwnerRepository", "which beans
    inject X". Every injection point the project's source declares, in Java, Kotlin or Scala: each
    constructor parameter of a bean class (a Kotlin primary constructor included), each field
    annotated @Autowired, @Inject or @Resource, and each parameter of a @Bean method. One row per
    injection point: the bean that asks, the type it asks for (a List, Optional or ObjectProvider
    of a type is that type), how it is injected, and whether a bean class of that name is declared
    in this project, counting Spring Data repository interfaces (false means another interface, a
    @Bean method's product, or a bean from a library).
    Filter on `type` for what uses a bean, on `bean` for what a bean needs. Read from declarations
    as written and matched by simple name: `candidates` lists the beans declared in this project that provide the type (the class itself, classes that say they extend or implement it, directly or through one of the project's own interfaces, Spring Data and Feign interfaces, and @Bean methods returning it); `injected` is the one Spring would choose when the source settles it (the only one, the @Primary one, or the one a @Qualifier names) and `resolution` says why, or that it is ambiguous. Beans from libraries and auto-configuration are not seen, so a single candidate here can still meet a library's at run time. Test source is left out.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:DECLARES_SOURCE]->(d:SpringDeclaration)
    WHERE NOT d.path CONTAINS 'src/test/' AND d.kind IN ['class', 'object', 'interface', 'constructor', 'field', 'method']
    WITH collect(d) AS all
    WITH all, [x IN all WHERE (x.kind IN ['class', 'object'] AND ANY(a IN x.annotations WHERE a IN ['Component', 'Service', 'Repository', 'Controller', 'RestController', 'Configuration', 'ControllerAdvice', 'RestControllerAdvice'])) OR (x.kind = 'interface' AND (x.signature CONTAINS 'Repository<' OR 'FeignClient' IN x.annotations)) | x.name] AS beanNames
    /* What could be injected: each bean class with the types it says it extends or implements, each Spring Data or Feign interface, and each @Bean method with the type it returns. */
    WITH all, beanNames,
         [x IN all WHERE x.kind IN ['class', 'object', 'interface'] AND x.name IN beanNames
            | {name: x.name, primary: 'Primary' IN x.annotations OR 'FeignClient' IN x.annotations, feign: 'FeignClient' IN x.annotations, isInterface: x.kind = 'interface', how: 'class',
               supers: ' ' + replace(replace(replace(reduce(kept = '', piece IN split(
                   CASE WHEN x.language = 'java' THEN CASE WHEN x.signature CONTAINS ' implements ' THEN split(x.signature, ' implements ')[1] WHEN x.kind = 'interface' AND x.signature CONTAINS ' extends ' THEN split(x.signature, ' extends ')[1] ELSE '' END
                                                      + CASE WHEN x.kind <> 'interface' AND x.signature CONTAINS ' extends ' THEN ' ' + split(split(x.signature, ' extends ')[1], ' implements ')[0] ELSE '' END
                        WHEN x.signature CONTAINS ') : ' THEN last(split(x.signature, ') : '))
                        WHEN x.signature CONTAINS ' : ' THEN last(split(x.signature, ' : ')) ELSE '' END,
                   '<') | CASE WHEN kept = '' THEN piece WHEN piece CONTAINS '>' THEN kept + ' ' + last(split(piece, '>')) ELSE kept END),
                   ',', ' '), '(', ' '), ')', ' ') + ' '}] +
         [x IN all WHERE x.kind = 'method' AND 'Bean' IN x.annotations
            | {name: x.name, primary: 'Primary' IN x.annotations, feign: false, isInterface: false, how: '@Bean method',
               supers: ' ' + split(CASE WHEN x.language = 'java' THEN split(trim(split(x.signature, '(')[0]), ' ')[size(split(trim(split(x.signature, '(')[0]), ' ')) - 2]
                                        WHEN x.signature CONTAINS '): ' THEN split(trim(last(split(x.signature, '): '))), ' ')[0] ELSE '' END, '<')[0] + ' '}] AS candidates,
         /* Interfaces and abstract types of the project that extend another: a class implementing one of these also provides what it extends, one step up. */
         [x IN all WHERE x.kind IN ['interface', 'class'] AND (x.signature CONTAINS ' extends ' OR x.signature CONTAINS ' : ')
            | [x.name, ' ' + replace(replace(replace(replace(CASE WHEN x.signature CONTAINS ' extends ' THEN split(x.signature, ' extends ')[1] ELSE last(split(x.signature, ' : ')) END, ',', ' '), '(', ' '), '<', ' '), '>', ' ') + ' ']] AS parents
    UNWIND all AS d
    WITH d, beanNames, candidates, parents, last(split(coalesce(d.owner, ''), '.')) AS ownerName
    WHERE (d.kind = 'constructor' AND ownerName IN beanNames)
       OR (d.kind = 'class' AND d.language <> 'java' AND d.signature CONTAINS '(' AND d.name IN beanNames)
       OR (d.kind = 'field' AND ANY(a IN d.annotations WHERE a IN ['Autowired', 'Inject', 'Resource']))
       OR (d.kind = 'method' AND 'Bean' IN d.annotations AND d.signature CONTAINS '(')
    WITH d, beanNames, candidates, parents, ownerName, CASE WHEN d.signature CONTAINS '): ' THEN split(d.signature, '): ')[0] ELSE split(d.signature, ') :')[0] END AS head
    WITH d, beanNames, candidates, parents, ownerName,
         CASE WHEN d.kind = 'field' THEN d.signature ELSE substring(head, size(split(head, '(')[0]) + 1) END AS asked
    UNWIND split(asked, ',') AS piece
    WITH d, beanNames, candidates, parents, ownerName, trim(replace(piece, ')', '')) AS piece
    WITH d, beanNames, candidates, parents, ownerName, piece, split(piece, ' ') AS tokens
    WITH d, beanNames, candidates, parents, ownerName,
         CASE WHEN piece CONTAINS '@Qualifier("' THEN split(split(piece, '@Qualifier("')[1], '"')[0] WHEN d.kind = 'field' AND ANY(t IN d.annotationText WHERE t STARTS WITH '@Qualifier("') THEN split([t IN d.annotationText WHERE t STARTS WITH '@Qualifier("'][0], '"')[1] END AS qualifier,
         CASE WHEN d.language <> 'java' AND piece CONTAINS ':' THEN trim(split(last(split(piece, ':')), '=')[0])
              WHEN d.language = 'java' AND size(tokens) >= 2 THEN tokens[size(tokens) - 2]
              ELSE '' END AS written
    WITH d, beanNames, candidates, parents, ownerName, qualifier, replace(written, '?', '') AS written
    WITH d, candidates, parents, beanNames, ownerName, qualifier, written,
         written CONTAINS '<' AND split(written, '<')[0] IN ['List', 'Set', 'Collection', 'ObjectProvider'] AS many,
         CASE WHEN written CONTAINS '<' AND split(written, '<')[0] IN ['List', 'Set', 'Collection', 'Optional', 'ObjectProvider', 'Provider', 'Lazy']
              THEN split(split(written, '<')[1], '>')[0] ELSE split(written, '<')[0] END AS type
    WHERE type <> '' AND NOT type CONTAINS '"' AND NOT type CONTAINS '(' AND NOT type CONTAINS '>' AND NOT type CONTAINS ' ' AND toUpper(left(type, 1)) = left(type, 1) AND toLower(left(type, 1)) <> left(type, 1)
    WITH d, beanNames, candidates, parents, ownerName, qualifier, written, many, type, ' ' + type + ' ' AS needle
    WITH d, beanNames, candidates, ownerName, qualifier, written, many, type, needle, [x IN parents WHERE x[1] CONTAINS needle | ' ' + x[0] + ' '] AS viaParents
    WITH d, beanNames, ownerName, qualifier, written, many, type,
         [c IN candidates WHERE NOT c.isInterface AND (c.name = type AND c.how = 'class' OR c.supers CONTAINS needle OR ANY(v IN viaParents WHERE c.supers CONTAINS v))] +
         [c IN candidates WHERE c.isInterface AND c.name = type] AS found
    WITH d, beanNames, ownerName, qualifier, written, many, type, found,
         [c IN found WHERE c.primary] AS primaries,
         [c IN found WHERE qualifier IS NOT NULL AND toLower(c.name) = toLower(qualifier)] AS qualified
    RETURN CASE WHEN d.kind = 'method' THEN coalesce(d.owner, '') + '#' + d.name WHEN d.kind = 'class' THEN d.name ELSE ownerName END AS bean,
           type, written AS asWritten,
           [c IN found | c.name] AS candidates,
           CASE WHEN many THEN null WHEN size(qualified) = 1 THEN qualified[0].name WHEN size(found) = 1 THEN found[0].name WHEN size(primaries) = 1 THEN primaries[0].name END AS injected,
           CASE WHEN size(found) = 0 THEN 'not declared in this project: a library\'s bean, or one registered another way'
                WHEN many THEN 'all ' + toString(size(found)) + ' declared here, as a collection'
                WHEN size(qualified) = 1 THEN 'named by @Qualifier'
                WHEN size(found) = 1 THEN CASE WHEN found[0].name = type THEN 'the type itself' ELSE 'the only one declared here' END
                WHEN size(primaries) = 1 THEN CASE WHEN primaries[0].feign THEN 'the Feign client, which is primary by default, among ' ELSE 'marked @Primary among ' END + toString(size(found))
                ELSE 'ambiguous: ' + toString(size(found)) + ' declared here and none is @Primary or named by @Qualifier; Spring falls back to the parameter\'s name, and fails if that matches none' END AS resolution,
           CASE d.kind WHEN 'field' THEN 'field' WHEN 'method' THEN '@Bean method parameter' ELSE 'constructor' END AS injectedBy,
           type IN beanNames AS declaredHere,
           d.language AS language, d.path AS file, d.line AS line, d.url AS link
    ORDER BY bean, type LIMIT 20000
