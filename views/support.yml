# SUPPORT: an error or a question, answered from where Spring developers already raised it.

- name: KnownIssues
  description: >-
    SELECT THIS for "is this a known bug", "has anyone reported this error", "is there an issue for
    X in Spring Boot". Issues in the Spring projects' own GitHub trackers (the spring-projects
    organisation) that match the words given: an exception message, a class or property name, a
    symptom. Each with its repository, number, title, whether it is open, the milestone it is
    assigned to (usually the release that fixes it), comment count and link, best match first. At
    most 15. Pass the distinctive words of an error, not a whole stack trace. GitHub allows about
    ten keyless searches a minute; answers are kept for an hour.
  params:
    words: { type: string, description: "The distinctive words of the error or question, e.g. 'JacksonAutoConfiguration ObjectMapper missing bean'." }
  cypher: |
    MATCH (s:Concept {value: $words})-[:RELEVANT_TO]->(i:SpringIssue)
    RETURN split(i.repositoryUrl, '/repos/')[1] AS repository, i.number AS number, i.title AS title, i.state AS state,
           i.milestone AS milestone, i.comments AS comments, left(i.createdAt, 10) AS opened, left(coalesce(i.closedAt, ''), 10) AS closed, i.url AS link
    LIMIT 15

- name: AskedBefore
  description: >-
    SELECT THIS for "how do others solve this", "is there an answer for this error". Stack Overflow
    questions tagged spring-boot that match the words given, most relevant first: title, votes,
    answer count, whether it has an accepted or upvoted answer, views, the year it was asked (old
    answers often describe an earlier Spring Boot), and link. At most 10. Kept for an hour.
  params:
    words: { type: string, description: "Plain words: the error message's distinctive part, or the question." }
  cypher: |
    MATCH (s:Concept {value: $words})-[:RELEVANT_TO]->(q:SpringQuestion)
    RETURN q.title AS title, q.score AS votes, q.answers AS answers, q.answered AS answered, q.views AS views,
           1970 + q.createdAt / 31557600 AS askedIn, q.url AS link
    LIMIT 10

- name: SpringDocs
  description: >-
    SELECT THIS for "what do the Spring docs say about X", "how do I migrate X", "what replaced
    this property". Passages of Spring's own documentation closest in meaning to the words given:
    the Spring Boot 2.0, 3.0 and 4.0 migration guides, the 3.5, 4.0 and 4.1 release notes, the
    upgrading guide, the Spring Framework 6 and 7 upgrade notes, Spring Security's migration and
    configuration pages, and the reference pages on configuration, profiles, auto-configuration
    and actuator endpoints. Each with the page it is from, its title, the passage and how close
    it is. A short curated set, not the whole reference manual.
  params:
    words: { type: string, description: "What you want to know, in words." }
  cypher: |
    MATCH (c:Concept {value: $words})-[r:RELEVANT_TO]->(h:SpringDocHit)
    WHERE 'spring-docs' IN h.tags
    RETURN CASE WHEN h.title STARTS WITH '<' THEN h.uri ELSE h.title END AS title, h.uri AS page, r.snippet AS passage, r.score AS score, r.mode AS foundBy
    ORDER BY score DESC LIMIT 8

- name: Docs
  description: >-
    SELECT THIS for "what do the docs say about X" when the answer may be in Spring's documentation,
    in the project's own documents, or in what the team has added. Passages closest in meaning to
    the words given, from three places: Spring's documentation (the reference manuals for Spring
    Boot, Framework and Security, the migration guides and release notes); the project's own
    Markdown and AsciiDoc files; and documents someone added on the Spring page for this project.
    Each with where it is from, the page, its title, the passage and how close it is.
  params:
    words: { type: string, description: "What you want to know, in words." }
    project: { type: string, default: "", description: "Project key, to include that project's own documents and what was added for it. Empty searches Spring's documentation only." }
  cypher: |
    MATCH (c:Concept {value: $words})-[r:RELEVANT_TO]->(h:SpringDocHit)
    WITH h, r, 'project-doc://' + CASE WHEN $project = '' THEN '~none~' WHEN $project STARTS WITH 'https://' THEN substring($project, 8) ELSE $project END + '!' AS own,
         'spring-notes://' + CASE WHEN $project = '' THEN '~none~' WHEN $project STARTS WITH 'https://' THEN substring($project, 8) ELSE $project END + '/' AS added
    WHERE 'spring-docs' IN h.tags OR h.uri STARTS WITH own OR h.uri STARTS WITH added
    RETURN CASE WHEN h.uri STARTS WITH added THEN 'Added by your team' WHEN h.uri STARTS WITH own THEN 'This project\'s documents' ELSE 'Spring documentation' END AS source,
           CASE WHEN h.title STARTS WITH '<' THEN h.uri ELSE h.title END AS title, h.uri AS page, r.snippet AS passage, r.score AS score
    ORDER BY score DESC LIMIT 10

- name: DocsAnswer
  description: >-
    SELECT THIS for a written answer to a Spring question, from documentation. An answer to the
    question, written by the appliance's model from the six passages closest to it in Spring's
    documentation, the project's own documents and what the team added, citing each passage it
    relies on by its number ([1], [2]); with the passages it was given, in that order. It answers
    only from those passages and says so when they do not cover the question. One model call.
  params:
    words: { type: string, description: "The question, in words." }
    project: { type: string, default: "", description: "Project key, to include that project's own documents and what was added for it." }
  cypher: |
    MATCH (c:Concept {value: $words})-[r:RELEVANT_TO]->(h:SpringDocHit)
    WITH h, r, 'project-doc://' + CASE WHEN $project = '' THEN '~none~' WHEN $project STARTS WITH 'https://' THEN substring($project, 8) ELSE $project END + '!' AS own,
         'spring-notes://' + CASE WHEN $project = '' THEN '~none~' WHEN $project STARTS WITH 'https://' THEN substring($project, 8) ELSE $project END + '/' AS added
    WHERE 'spring-docs' IN h.tags OR h.uri STARTS WITH own OR h.uri STARTS WITH added
    WITH h, r ORDER BY r.score DESC LIMIT 6
    WITH collect({title: CASE WHEN h.title STARTS WITH '<' THEN h.uri ELSE h.title END, page: h.uri, passage: left(coalesce(r.snippet, ''), 1500)}) AS hits
    WITH hits, reduce(t = '', i IN range(0, size(hits) - 1) | t + '[' + toString(i + 1) + '] ' + hits[i].title + '\n' + hits[i].passage + '\n\n') AS passages
    RETURN synthesize(passages, 'Answer this question for a developer working on a Spring application: ' + $words +
             '. Use only the numbered passages. Cite each passage you rely on by its number in square brackets. If the passages do not answer it, say what they do not cover. Three to six sentences, no preamble.') AS answer,
           [x IN hits | x.title] AS titles, [x IN hits | x.page] AS pages
